# =====================================================================
# Base configuration. Every environment-specific value comes from an
# environment variable. NO SECRETS IN THIS FILE.
# =====================================================================
spring:
  application:
    name: interview-platform

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Small pool: Supabase's transaction-mode pooler sits in front of
      # Postgres, so a large client-side pool buys nothing.
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
      pool-name: interview-platform-pool

  jpa:
    hibernate:
      # Flyway owns schema evolution. Hibernate MUST NOT create or alter
      # anything — it only verifies that the entity mapping matches the
      # migrated schema. Never change this to update/create/create-drop.
      ddl-auto: validate
    open-in-view: false          # no lazy loading during REST serialization
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_schema: app
    show-sql: false

  flyway:
    enabled: true
    schemas: app
    default-schema: app
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  threads:
    virtual:
      enabled: true              # Java 21 virtual threads for request handling

server:
  port: ${SERVER_PORT:8080}
  error:
    # Errors are produced by GlobalExceptionHandler as RFC 9457 problem
    # details. Nothing about the internals is ever exposed.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    whitelabel:
      enabled: false
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true

logging:
  level:
    root: INFO
    com.aiinterview.interviewplatform: INFO
    org.flywaydb: INFO
  pattern:
    # traceId is placed in the MDC by TraceIdFilter and must be present on
    # every log line so a support request can be correlated to a request.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

# ---------------------------------------------------------------- app
app:
  # Bound to AppProperties and validated at startup. A missing or invalid
  # value fails the context refresh rather than surfacing as a null at 2am.
  environment: ${APP_ENVIRONMENT:local}
  engine-version: ${APP_ENGINE_VERSION:@project.version@}
  api:
    base-path: /api/v1
