# Local development defaults. Still no secrets: these are throwaway
# credentials for a disposable local database only.
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/interview_platform}
    username: ${DATABASE_USERNAME:interview}
    password: ${DATABASE_PASSWORD:interview}
  jpa:
    show-sql: true

app:
  # Publishes a realistic interview into an empty local database so the
  # candidate UI has something to run against. Off everywhere else, and a
  # no-op once the template exists.
  dev-seed:
    enabled: ${APP_DEV_SEED:true}

logging:
  level:
    com.aiinterview.interviewplatform: DEBUG
    org.hibernate.SQL: DEBUG
