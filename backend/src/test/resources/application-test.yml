# Test profile. The datasource is supplied by Testcontainers via
# @ServiceConnection, so no URL is configured here.
spring:
  jpa:
    hibernate:
      ddl-auto: validate     # the whole point of the mapping test
    show-sql: false
  flyway:
    enabled: true
    schemas: app
    default-schema: app

app:
  environment: test
  engine-version: test

logging:
  level:
    org.testcontainers: INFO
    com.github.dockerjava: WARN
