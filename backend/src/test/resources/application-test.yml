# Test profile. The datasource is supplied by Testcontainers via
# @ServiceConnection, so no URL is configured here.
spring:
  jpa:
    hibernate:
      ddl-auto: validate     # the whole point of the mapping test
    show-sql: false
  flyway:
    enabled: true
    schemas: app
    default-schema: app

app:
  environment: test
  engine-version: test
  jobs:
    # The scheduled worker is off in tests. Tests drive JobWorker.pollOnce()
    # directly and assert on what it returns, which is deterministic; a
    # background poller would race those assertions and silently claim the very
    # jobs a test is about to inspect.
    worker-enabled: false
    # Short enough that a lease-expiry test need not sleep.
    lease-seconds: 30
    initial-backoff-seconds: 1
    max-backoff-seconds: 8

logging:
  level:
    org.testcontainers: INFO
    com.github.dockerjava: WARN
